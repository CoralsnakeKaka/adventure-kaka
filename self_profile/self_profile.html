<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>向珊胡的个人主页</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            max-width: 800px;
            margin: 40px auto;
            background-color: #f0f0f0;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.8;
            color: #333;
        }

        .header {
            display:flex;
            align-items: center;
            margin-bottom: 40px;
        }
        .header img {
            width: 100px;
            height: 100px;
            margin-right: 20px;
            object-fit: cover;
        }
        .header-text h1 {
            margin: 0;
            font-size: 36px;
            color: #333;
        }
        .header-text p {
            margin: 5px 0 0;
            font-size: 18px;
            color: #333;
        }
       
        h2 {
            color: #333;
            margin-top: 40px;
            font-size: 28px;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }
        .tag {
            background-color: #000000;
            color: rgb(255, 255, 255);
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 14px;
        }
        
        a {
            color: #007BFF;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }

        ul {
            list-style-type: disc;
            padding-left: 20px;
        }
        li {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <h1>向珊胡</h1>
    <p>欢迎来到我的个人主页！</p>
    <p>这里是我的一些个人信息：</p>
    <ul>
        <li>姓名：向珊胡</li>
        <li></li>
        <li></li>
    </ul>
    <p>感谢您的访问！</p>
